name: Feature request
description: Propose a capability or improvement for Macroma.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does your team struggle with today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what you want from the user's point of view, without a specific implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kanban board
        - Task versions
        - Batch releases
        - Workspaces and projects
        - Comments, activity or chat
        - Sign-in and accounts
        - Install, build or deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or simpler approaches you considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
