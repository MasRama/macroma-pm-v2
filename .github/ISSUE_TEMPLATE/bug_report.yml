name: Bug report
description: Report a reproducible problem in Macroma.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Keep security vulnerabilities out of public issues and use the security policy instead.

  - type: input
    id: version
    attributes:
      label: Macroma version
      description: The release (from CHANGELOG.md or package.json) or the commit where you saw the problem.
      placeholder: "2.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Kanban board
        - Task versions
        - Batch releases
        - Workspaces and projects
        - Comments, activity or chat
        - Sign-in and accounts
        - Install, build or deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you saw and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste short logs or error messages. Remove secrets and private data.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, and anything else relevant.
      placeholder: "Firefox 140, Ubuntu 24.04, Node 22.20.0"

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report does not contain credentials, tokens, private data, or an undisclosed security vulnerability.
          required: true
